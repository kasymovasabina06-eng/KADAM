spring.application.name=java-platform
server.port=8080

# Local SQL Server Express. SQL Server Browser and TCP/IP must be enabled.
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=java_platform;encrypt=true;trustServerCertificate=true
spring.datasource.username=java_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database table is provisioned using setup_database.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

