<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — ЖАВА</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-bg"><header class="header"><a class="brand" href="/">ЖАВА<span>●</span></a><nav><a href="/register">Создать аккаунт</a></nav></header><main class="auth-card"><div class="eyebrow">С ВОЗВРАЩЕНИЕМ</div><h1>Войти в ЖАВА</h1><p>После входа откроется твой личный кабинет.</p><div class="notice" th:if="${param.error}">Проверьте электронную почту и пароль.</div><div class="notice success" th:if="${registered}">Регистрация прошла успешно! Войдите.</div><form th:action="@{/login}" method="post"><label>Email</label><input type="email" name="email" placeholder="name@example.com" required><label>Пароль</label><input type="password" name="password" required><button class="button full" type="submit">Войти →</button></form></main></body></html>
