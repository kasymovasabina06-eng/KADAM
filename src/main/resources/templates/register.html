<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — ЖАВА</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-bg"><header class="header"><a class="brand" href="/">ЖАВА<span>●</span></a><nav><a href="/login">Уже есть аккаунт? Войти</a></nav></header>
<main class="auth-card"><div class="eyebrow">ПРИСОЕДИНЯЙСЯ</div><h1>Создать аккаунт</h1><p>Выбери категорию и расскажи немного о себе.</p><form th:action="@{/register}" th:object="${form}" method="post"><label>Кто ты?</label><select th:field="*{role}" required><option value="">Выберите категорию</option><option th:each="r : ${roles}" th:value="${r}" th:text="${r.name() == 'VOLUNTEER' ? 'Волонтёр' : r.name() == 'INTERNSHIP_STUDENT' ? 'Студент — стажировка' : r.name() == 'PRACTICE_STUDENT' ? 'Студент — практика' : r.name() == 'ORGANIZATION' ? 'Компания / организация' : 'Нужна помощь'}"></option></select><div class="err" th:errors="*{role}"></div>
<label>Имя и фамилия / название организации</label><input th:field="*{fullName}" placeholder="Введите имя или название" required><div class="err" th:errors="*{fullName}"></div><label>Электронная почта</label><input th:field="*{email}" type="email" placeholder="name@example.com" required><div class="err" th:errors="*{email}"></div><label>Город</label><input th:field="*{city}" placeholder="Бишкек"><label>Специальность / сфера деятельности</label><input th:field="*{specialization}" placeholder="Например, IT"><label>Пароль (не менее 8 символов)</label><input th:field="*{password}" type="password" minlength="8" autocomplete="new-password" required><div class="err" th:errors="*{password}"></div><button class="button full" type="submit">Зарегистрироваться</button></form></main></body></html>
